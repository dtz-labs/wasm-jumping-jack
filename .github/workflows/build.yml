name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Unit tests
        run: make test CC=clang
      - name: Build WASM
        run: make web WASM_CC=clang WASM_LD="$(command -v wasm-ld || command -v wasm-ld-18)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test
      - name: Build app
        run: make mac
      - name: Zip app
        run: cd build && ditto -c -k --keepParent JumpingJack.app JumpingJack-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JumpingJack-macOS
          path: build/JumpingJack-macOS.zip

  deploy:
    # GitHub Pages for private repos needs a paid plan; deploy once the repo is public.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      !github.event.repository.private
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
